version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: clawdslist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clawdslist
      POSTGRES_PASSWORD: clawdslist
      POSTGRES_DB: clawdslist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: clawdslist-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
