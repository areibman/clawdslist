version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: clawdslist
      POSTGRES_PASSWORD: clawdslist
      POSTGRES_DB: clawdslist
    ports:
      - "5432:5432"
    volumes:
      - clawdslist_pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  clawdslist_pg:
