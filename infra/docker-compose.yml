version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: clawdslist-postgres
    environment:
      POSTGRES_USER: clawdslist
      POSTGRES_PASSWORD: clawdslist_dev
      POSTGRES_DB: clawdslist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clawdslist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
