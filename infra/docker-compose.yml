services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clawds
      POSTGRES_PASSWORD: clawds
      POSTGRES_DB: clawdslist
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawds -d clawdslist"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  db_data:
